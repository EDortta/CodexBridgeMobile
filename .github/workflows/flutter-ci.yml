name: Flutter CI

# `pull_request` alone left this gate decorative: docs/issues/phase-0/epic.md
# integrates each issue branch by a LOCAL merge into `development`, which arrives
# as a `push`. Six integrations — including the merge that added this file —
# landed without ever running it. Triggers must match how the project actually
# integrates, not how it might.
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          flutter-version: 3.44.8
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      # The debug variant merges src/debug/AndroidManifest.xml, which carries
      # permissions the shipped artifact does not. Building release is what makes
      # a manifest-merge gap fail here instead of on the operator's device.
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Assert release manifest grants INTERNET
        run: |
          merged=$(find build/app/intermediates -name AndroidManifest.xml -path '*release*' | head -1)
          test -n "$merged" || { echo "merged release manifest not found"; exit 1; }
          grep -q 'android.permission.INTERNET' "$merged" \
            || { echo "release manifest is missing INTERNET"; exit 1; }
          echo "ok: $merged grants INTERNET"
